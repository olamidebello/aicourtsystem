events { worker_connections 2048; }
http {
  client_max_body_size 100m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  server {
    listen 80;
    server_name _;
    location /api/ { proxy_pass http://api:4000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth/ { proxy_pass http://keycloak:8080/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
